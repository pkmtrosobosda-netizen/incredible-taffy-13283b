<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>SI-BALITA (Live Sync)</title>
<style>
:root{--bg:#f3f7f6;--cd:#fff;--tx:#17302b;--mu:#5d716c;--pr:#0f766e;--pl:#d9f2ee;--bd:#dbe5e2;--bad:#b42318;--ok:#15803d;--wr:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1917;--cd:#152622;--tx:#e6f2ef;--mu:#98b0aa;--pr:#2dd4bf;--pl:#173a35;--bd:#26413c;--bad:#f87171;--ok:#4ade80;--wr:#fbbf24}}
:root[data-theme=dark]{--bg:#0e1917;--cd:#152622;--tx:#e6f2ef;--mu:#98b0aa;--pr:#2dd4bf;--pl:#173a35;--bd:#26413c;--bad:#f87171;--ok:#4ade80;--wr:#fbbf24}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.app{display:flex;min-height:100vh}nav{width:220px;background:var(--cd);border-right:1px solid var(--bd);padding:14px 10px;flex:none}
nav h1{font-size:18px;margin:0 8px 12px;color:var(--pr)}nav a{display:block;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--mu)}nav a.on{background:var(--pl);color:var(--pr);font-weight:600}
main{flex:1;min-width:0;padding:16px}h2{margin:4px 0 12px;font-size:20px}h3{margin:16px 0 8px;font-size:15px}
.top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;color:var(--mu)}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k,.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px}.k small{color:var(--mu)}.k b{display:block;font-size:26px;color:var(--pr)}
.tw{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--bd);vertical-align:top}th{font-size:12px;color:var(--mu);text-transform:uppercase}small{color:var(--mu)}
input,select,button,textarea{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:6px 8px}input.n{width:76px}
button{background:var(--pr);color:#fff;border:0;cursor:pointer;font-weight:600}button.s{background:var(--pl);color:var(--pr)}
.bar2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.b{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--pl);color:var(--pr)}
.b.ok{color:var(--ok)}.b.wr{color:var(--wr)}.b.bad{color:var(--bad)}.b.mu{color:var(--mu)}
.ch{display:flex;align-items:flex-end;gap:10px;height:200px;padding:10px 0}.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.bc i{width:100%;max-width:56px;background:var(--pr);border-radius:6px 6px 0 0;display:block}.bc span,.bc b{font-size:12px}.bc b{color:var(--mu);font-weight:500}
.pb{display:inline-block;width:90px;height:8px;background:var(--bd);border-radius:9px;vertical-align:middle;margin-right:6px}.pb i{display:block;height:100%;background:var(--pr);border-radius:9px}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}.fm label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mu)}
.lg{max-width:420px;margin:10vh auto;padding:0 16px}.lg .cd{display:flex;flex-direction:column;gap:10px}
#ts{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:8px 16px;border-radius:99px;display:none}
@media(max-width:800px){.app{flex-direction:column}nav{width:100%;display:flex;overflow-x:auto;gap:4px;padding:8px}nav h1{display:none}nav a{white-space:nowrap}}
@media print{nav,.top,.bar2,#ts{display:none!important}}
</style></head><body><div id="app"><div class=lg><div class=cd><h2 style="color:var(--pr)">🩺 SI-BALITA</h2><p>Menyambungkan…</p></div></div></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const POS=['Kramat Jegu','Trosobo','Krembangan','Bringin Bendo','Pertapan Maduretno','Sidodadi','Sambibulu','Gilang','Tanjung Sari'];let MS=[];
const mm=(m,n)=>{let y=+m.slice(0,4),k=+m.slice(5)-1+n;y+=Math.floor(k/12);k=(k%12+12)%12;return y+'-'+String(k+1).padStart(2,'0')};
const BL=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'],ml=m=>BL[+m.slice(5)-1]+' '+m.slice(2,4);
const RN={admin:'Admin Puskesmas',gizi:'Petugas Gizi',kader:'Kader Posyandu'};
let M=new Date().toISOString().slice(0,7),pg='dash',U=null;
let B=[],W={},F={},R={},J={},AU=[],ROLES={};
POS.forEach((p,i)=>J[p]='2026-10-'+String(6+i).padStart(2,'0'));
B.push({id:'B001',nama:'Aisyah Pratama',nik:'357801234567',lahir:'2024-03-15',jk:'P',ibu:'Siti Hartini',wa:'6281234567890',alamat:'Jl. Kenjeran No. 1 RT 01',pos:'Kramat Jegu',status:'Aktif',ver:{s:'Belum diverifikasi',ket:''}});
const age=l=>{const d=new Date(l),n=new Date(),m=(n.getFullYear()-d.getFullYear())*12+n.getMonth()-d.getMonth()-(n.getDate()<d.getDate()?1:0);return Math.floor(m/12)+' th '+m%12+' bl'};
const vis=()=>B.filter(b=>U.role!='kader'||b.pos==U.pos),act=b=>b.status=='Aktif',got=(b,m=M)=>!!W[b.id+'|'+m]?.hadir;
const stat=(l,m)=>{const s=l.filter(act),d=s.filter(b=>got(b,m)).length;return{S:s.length,D:d,N:s.length-d,P:s.length?d/s.length*100:0}};
const pct=x=>x.toFixed(1)+'%',bd=(t,c='')=>`<span class="b ${c}">${E(t)}</span>`,pbar=p=>`<span class=pb><i style="width:${p}%"></i></span>${pct(p)}`;
const L=t=>{AU.unshift({w:new Date().toLocaleString('id-ID'),u:MEID,t});push('AU')},fk=b=>F[b.id+'|'+M]??={alasan:'Belum dicatat',st:'Belum ditindaklanjuti',log:[]};
const toast=t=>{const e=$('#ts');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1800)};
const tb=(h,r)=>`<div class=tw><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r.join('')||`<tr><td colspan=${h.length}><small>Belum ada data.</small></td></tr>`}</table></div>`;
const posL=()=>U.role=='kader'?[U.pos]:POS;
const NAV=[['dash','Dashboard'],['sas','Data Sasaran'],['ver','Verifikasi Lapangan'],['tim','Penimbangan'],['bel','Belum Ditimbang'],['rem','Reminder Posyandu'],['tl','Tindak Lanjut'],['rek','Rekap & Laporan'],['usr','Pengguna','a'],['log','Riwayat Perubahan','ag']];
let ME=null,MEID=null,IS_OWNER=false,USERCAP=null,dbReady=false,NAMES={};
function getU(){const r=ROLES[MEID];if(!r)return null;return{nama:ME?.name||nm(MEID)||'Anda',role:r.role,pos:r.pos}}
async function resolveNames(ids){const need=[...new Set(ids)].filter(id=>id&&!(id in NAMES));if(!need.length)return false;const ps=await USERCAP.profiles(need);need.forEach(id=>NAMES[id]=ps[id]?.name||'');return true}
function nm(id){return NAMES[id]||'…'}
function ensureNames(ids){resolveNames(ids).then(ch=>{if(ch)go()})}
function go(){const a=$('#app');
if(!ME){a.innerHTML=`<div class=lg><div class=cd><h2 style="color:var(--pr)">🩺 SI-BALITA</h2><small>Sistem Informasi Balita — Puskesmas Trosobo</small><p>Buka halaman ini lewat tautan artifact yang dibagikan di claude.ai. Identitas Anda diverifikasi otomatis dari akun organisasi — tidak perlu login, dan tidak perlu login ulang saat refresh.</p></div></div>`;return}
if(!dbReady){a.innerHTML=`<div class=lg><div class=cd><h2 style="color:var(--pr)">🩺 SI-BALITA</h2><p>Menyambungkan…</p></div></div>`;return}
U=getU();
if(!U){a.innerHTML=`<div class=lg><div class=cd><h2 style="color:var(--pr)">🩺 SI-BALITA</h2><p>Halo, ${E(ME.name||'Pengguna')}. Akun Anda belum ditetapkan perannya oleh Admin Puskesmas. Hubungi admin agar bisa mulai mengisi data — data akan langsung tersinkron begitu peran diberikan.</p></div></div>`;return}
MS=[-5,-4,-3,-2,-1,0].map(n=>mm(M,n));
a.innerHTML=`<div class=app><nav><h1>🩺 SI-BALITA</h1>${NAV.filter(n=>(n[2]||'agk').includes(U.role[0])).map(n=>`<a class="${n[0]==pg?'on':''}" onclick="pg='${n[0]}';go()">${n[1]}</a>`).join('')}</nav><main><div class=top><span>${E(U.nama)} · <b>${RN[U.role]}</b>${U.role=='kader'?' · Desa '+U.pos:''}</span><span><small id=sy>● ${syt}</small> <input type=month value=${M} onchange="if(this.value){M=this.value;go()}"></span></div>${P[pg]()}</main></div>`}
const P={};
P.dash=()=>{const v=vis(),s=stat(v,M);const k=(t,x)=>`<div class=k><small>${t}</small><b>${x}</b></div>`;
return `<h2>Dashboard — ${ml(M)}</h2><div class=g4>${k('Total sasaran (S)',s.S)}${k('Sudah ditimbang (D)',s.D)}${k('Belum ditimbang',s.N)}${k('Persentase D/S',pct(s.P))}</div>
<h3>Grafik D/S per bulan</h3><div class=cd><div class=ch>${MS.map(m=>{const x=stat(v,m);return `<div class=bc><b>${pct(x.P)}</b><i style="height:${x.P*.75}%"></i><span>${ml(m)}</span></div>`}).join('')}</div></div>
<h3>Rekap D/S per Desa</h3>${tb(['Desa','S','D','Belum','D/S'],posL().map(p=>{const x=stat(v.filter(b=>b.pos==p),M);return `<tr><td>${p}</td><td>${x.S}</td><td>${x.D}</td><td>${x.N}</td><td>${pbar(x.P)}</td></tr>`}))}`};
let q='',fp='';
const sasT=()=>tb(['ID / NIK','Nama','Lahir / Usia','JK','Ibu/Wali','WhatsApp','Alamat','Desa','Status data','Aksi'],vis().filter(b=>(b.nama+b.nik+b.ibu).toLowerCase().includes(q.toLowerCase())&&(!fp||b.pos==fp)).map(b=>`<tr><td>${b.id}<br><small>${b.nik}</small></td><td>${E(b.nama)}</td><td>${b.lahir}<br><small>${age(b.lahir)}</small></td><td>${b.jk}</td><td>${E(b.ibu)}</td><td>${b.wa}</td><td>${E(b.alamat)}</td><td>${b.pos}</td><td>${bd(b.status,b.status=='Aktif'?'ok':'wr')}<br>${bd(b.ver.s,'mu')}</td><td style="white-space:nowrap"><button class=s onclick="editB('${b.id}')">Ubah</button> <button class=s style="color:var(--bad)" onclick="delB('${b.id}')">${dc==b.id?'Yakin hapus?':'Hapus'}</button></td></tr>`));
let ed=null,dc=null;const eb=()=>B.find(b=>b.id==ed)||{};
P.sas=()=>{const e=eb(),v=x=>E(e[x]??'');return `<h2>Data Sasaran Balita</h2><div class=bar2><input placeholder="Cari nama / NIK / ibu" value="${E(q)}" oninput="q=this.value;$('#tb').innerHTML=sasT()">${U.role!='kader'?`<select onchange="fp=this.value;go()"><option value="">Semua Desa</option>${POS.map(p=>`<option ${p==fp?'selected':''}>${p}</option>`).join('')}</select>`:''}</div>
<details class=cd style="margin-bottom:10px" ${ed?'open':''}><summary><b>${ed?'Ubah data balita '+e.id:'+ Tambah balita'}</b></summary><div class=fm><label>Nama<input id=an value="${v('nama')}"></label><label>NIK/ID<input id=ak value="${v('nik')}"></label><label>Tgl lahir<input id=al type=date value="${v('lahir')}"></label><label>JK<select id=aj><option ${e.jk=='L'?'selected':''}>L</option><option ${e.jk=='P'?'selected':''}>P</option></select></label><label>Ibu/Wali<input id=ai value="${v('ibu')}"></label><label>WhatsApp (62…)<input id=aw value="${v('wa')}"></label><label>Alamat<input id=aa value="${v('alamat')}"></label><label>Desa<select id=ap>${posL().map(p=>`<option ${p==e.pos?'selected':''}>${p}</option>`).join('')}</select></label></div><p><button onclick=addB()>${ed?'Simpan perubahan':'Simpan'}</button> ${ed?'<button class=s onclick="ed=null;go()">Batal</button>':''}</p></details><div id=tb>${sasT()}</div>`};
function addB(){const g=i=>$('#'+i).value.trim();if(!g('an')||!g('al')){toast('Nama & tgl lahir wajib');return}
const d={nama:g('an'),nik:g('ak'),lahir:g('al'),jk:g('aj'),ibu:g('ai'),wa:g('aw'),alamat:g('aa'),pos:g('ap')};
if(ed){Object.assign(eb(),d);L('Ubah balita '+ed+' ('+d.nama+')');ed=null;toast('Data diubah')}
else{B.push({id:'B'+String(Math.max(0,...B.map(b=>+b.id.slice(1)))+1).padStart(3,'0'),...d,status:'Aktif',ver:{s:'Balita baru/belum terdata',ket:''}});L('Tambah balita '+d.nama);toast('Balita ditambahkan')}push('B');go()}
function editB(id){ed=id;dc=null;go();scrollTo(0,0)}
function delB(id){if(dc!=id){dc=id;$('#tb').innerHTML=sasT();return}B=B.filter(b=>b.id!=id);Object.keys(W).concat(Object.keys(F)).forEach(k=>{if(k.startsWith(id+'|')){delete W[k];delete F[k]}});L('Hapus balita '+id);dc=null;if(ed==id)ed=null;push('B');push('W');push('F');go();toast('Balita dihapus')}
const VO=['Belum diverifikasi','Data sesuai','Data tidak sesuai','Pindah domisili','Data ganda','Balita tidak ditemukan','Balita baru/belum terdata'];
P.ver=()=>`<h2>Verifikasi Data Lapangan</h2>${tb(['Balita','Desa','Hasil verifikasi','Keterangan','Status'],vis().map(b=>`<tr><td>${E(b.nama)}<br><small>${b.id}</small></td><td>${b.pos}</td><td><select id=vs${b.id} onchange="setV('${b.id}')">${VO.map(o=>`<option ${o==b.ver.s?'selected':''}>${o}</option>`).join('')}</select></td><td><input id=vk${b.id} value="${E(b.ver.ket)}" onchange="setV('${b.id}')" placeholder="Catatan"></td><td>${b.ver.s=='Belum diverifikasi'?bd('Belum','wr'):bd('Terverifikasi','ok')}</td></tr>`))}`;
function setV(id){const b=B.find(x=>x.id==id),s=$('#vs'+id).value;b.ver={s,ket:$('#vk'+id).value};b.status=s=='Pindah domisili'?'Pindah':s=='Data ganda'?'Ganda':s=='Balita tidak ditemukan'?'Tidak ditemukan':'Aktif';L(`Verifikasi ${b.nama}: ${s}`);push('B');go();toast('Tersimpan')}
let tp=null,tt=new Date().toISOString().slice(0,10),rb='';
P.tim=()=>{tp=tp||posL()[0];const m=tt.slice(0,7),l=vis().filter(b=>b.pos==tp&&act(b));rb=rb||(l[0]?.id||'');const hb=B.find(b=>b.id==rb);
return `<h2>Pencatatan Penimbangan</h2><div class=bar2><label>Desa <select onchange="tp=this.value;rb='';go()">${posL().map(p=>`<option ${p==tp?'selected':''}>${p}</option>`).join('')}</select></label><label>Tanggal <input type=date value=${tt} onchange="tt=this.value;go()"></label><button onclick=simpanT()>Simpan penimbangan</button></div>
${tb(['Balita','Hadir','Berat badan','Tinggi/panjang','Status'],l.map(b=>{const w=W[b.id+'|'+m]||{};return `<tr><td>${E(b.nama)}<br><small>${age(b.lahir)}</small></td><td><input type=checkbox id=h${b.id} ${w.hadir?'checked':''}></td><td><input class=n type=number step=.1 id=bb${b.id} value="${w.bb??''}"> kg</td><td><input class=n type=number step=.1 id=tk${b.id} value="${w.tb??''}"> cm</td><td>${w.hadir?bd('Sudah ditimbang','ok'):bd('Belum ditimbang','wr')}</td></tr>`}))}
<h3>Riwayat penimbangan bulanan</h3><div class=bar2><select onchange="rb=this.value;go()">${l.map(b=>`<option value=${b.id} ${b.id==rb?'selected':''}>${E(b.nama)}</option>`).join('')}</select></div>
${hb?tb(['Bulan','Status','BB (kg)','TB/PB (cm)'],MS.map(x=>{const w=W[hb.id+'|'+x];return `<tr><td>${ml(x)}</td><td>${w?bd('Ditimbang','ok'):bd('Tidak hadir','bad')}</td><td>${w?.bb||'-'}</td><td>${w?.tb||'-'}</td></tr>`})):''}`};
function simpanT(){const m=tt.slice(0,7);vis().filter(b=>b.pos==tp&&act(b)).forEach(b=>{const k=b.id+'|'+m;if($('#h'+b.id).checked)W[k]={hadir:true,bb:$('#bb'+b.id).value,tb:$('#tk'+b.id).value,tgl:tt};else delete W[k]});L(`Penimbangan Desa ${tp} ${tt}`);push('W');go();toast('Data penimbangan tersimpan')}
const AL=['Belum dicatat','Sakit','Bepergian','Lupa/tidak tahu jadwal','Ibu bekerja/sibuk','Pindah domisili','Lainnya'],bel=()=>vis().filter(b=>act(b)&&!got(b));
P.bel=()=>`<h2>Balita Belum Ditimbang — ${ml(M)}</h2><p><small>${bel().length} balita</small></p>${tb(['Balita','Ibu','WhatsApp','Alamat','Desa','Alasan tidak hadir','Tindak lanjut'],bel().map(b=>`<tr><td>${E(b.nama)}</td><td>${E(b.ibu)}</td><td><a href="https://wa.me/${b.wa}" target=_blank rel=noopener>+${b.wa}</a></td><td>${E(b.alamat)}</td><td>${b.pos}</td><td><select onchange="fk(B.find(x=>x.id=='${b.id}')).alasan=this.value;L('Alasan ${b.id}: '+this.value);push('F')">${AL.map(a=>`<option ${a==fk(b).alasan?'selected':''}>${a}</option>`).join('')}</select></td><td>${bd(fk(b).st,fk(b).st=='Belum ditindaklanjuti'?'wr':'ok')}</td></tr>`))}`;
const dm=(d,n)=>{const x=new Date(d);if(isNaN(x))return'';x.setUTCDate(x.getUTCDate()-n);return x.toISOString().slice(0,10)},tg=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}):'-';
const msg=(b,p)=>`Yth. Ibu ${b.ibu}, kami mengingatkan bahwa Posyandu Desa ${p} akan dilaksanakan besok, ${tg(J[p])}. Mohon membawa ${b.nama} untuk ditimbang. Terima kasih. — Puskesmas Trosobo`;
let rp=null;
P.rem=()=>`<h2>Reminder Posyandu (H-1)</h2><p><small>Semua reminder dikirim H-1. Tanggal jadwal bisa diubah kapan saja.</small></p>${tb(['Desa','Jadwal Posyandu','Kirim reminder (H-1)','Status',''],posL().map(p=>`<tr><td>${p}</td><td><input type=date value="${J[p]}" onchange="J['${p}']=this.value;R['${p}']=0;L('Ubah jadwal ${p}');push('J');push('R');go()"></td><td>${tg(dm(J[p],1))}</td><td>${R[p]?bd('Terkirim','ok'):bd('Belum','wr')}</td><td><button class=s onclick="rp='${p}';go()">Buka daftar kirim</button></td></tr>`))}
${rp&&posL().includes(rp)?(()=>{const p=rp,l=vis().filter(b=>b.pos==p&&act(b));return `<h3>Pesan WhatsApp — Desa ${p} (H-1)</h3><div class=cd><small>Contoh pesan:</small><p>${E(l[0]?msg(l[0],p):'Belum ada balita aktif di desa ini.')}</p><button onclick="R['${p}']=1;L('Reminder H-1 Desa ${p} terkirim');push('R');go();toast('Ditandai terkirim')">Tandai semua terkirim</button></div>${tb(['Ibu','Balita','Kirim'],l.map(b=>`<tr><td>${E(b.ibu)}</td><td>${E(b.nama)}</td><td><a href="https://wa.me/${b.wa}?text=${encodeURIComponent(msg(b,p))}" target=_blank rel=noopener>Kirim via WhatsApp</a></td></tr>`))}`})():''}`;
const JN=['Reminder WhatsApp','Telepon','Kunjungan rumah','Penimbangan susulan','Tidak dapat dihubungi'];
P.tl=()=>`<h2>Tindak Lanjut — ${ml(M)}</h2>${tb(['Balita','Status','Riwayat','Jenis tindak lanjut','Keterangan hasil',''],bel().map(b=>`<tr><td>${E(b.nama)}<br><small>${E(b.ibu)} · ${b.pos}</small></td><td>${bd(fk(b).st,fk(b).st=='Belum ditindaklanjuti'?'wr':'ok')}</td><td><small>${fk(b).log.map(x=>`${x.w}: ${x.j}${x.k?' – '+E(x.k):''}`).join('<br>')||'-'}</small></td><td><select id=tj${b.id}>${JN.map(j=>`<option>${j}</option>`).join('')}</select></td><td><input id=tn${b.id} placeholder="Hasil"></td><td><button onclick="catat('${b.id}')">Catat</button></td></tr>`))}`;
function catat(id){const b=B.find(x=>x.id==id),j=$('#tj'+id).value,f=fk(b);f.log.push({w:new Date().toLocaleDateString('id-ID'),j,k:$('#tn'+id).value});f.st=j=='Tidak dapat dihubungi'?j:j=='Penimbangan susulan'?'Ditimbang susulan':'Sudah dihubungi';if(j=='Penimbangan susulan'){W[id+'|'+M]={hadir:true,bb:'',tb:'',tgl:'susulan'};push('W')}L(`Tindak lanjut ${b.nama}: ${j}`);push('F');go();toast('Tindak lanjut dicatat')}
let rk='dsp';
const RT={sas:'Data sasaran',ver:'Data terverifikasi',hadir:'Kehadiran',absen:'Balita tidak hadir',tl:'Tindak lanjut',dsb:'D/S bulanan',dsp:'D/S per Desa'};
function RK(){const v=vis(),a=v.filter(b=>act(b));
if(rk=='sas')return{h:['Desa','Total','Aktif','Pindah','Ganda','Tidak ditemukan'],r:posL().map(p=>{const l=v.filter(b=>b.pos==p);return[p,l.length,...['Aktif','Pindah','Ganda','Tidak ditemukan'].map(s=>l.filter(b=>b.status==s).length)]})};
if(rk=='ver')return{h:['Hasil verifikasi','Jumlah'],r:VO.map(o=>[o,v.filter(b=>b.ver.s==o).length])};
if(rk=='hadir')return{h:['Balita','Desa','Kehadiran','BB','TB'],r:a.map(b=>{const w=W[b.id+'|'+M];return[b.nama,b.pos,w?'Hadir':'Tidak hadir',w?.bb||'',w?.tb||'']})};
if(rk=='absen')return{h:['Balita','Ibu','WhatsApp','Desa','Alasan'],r:bel().map(b=>[b.nama,b.ibu,b.wa,b.pos,fk(b).alasan])};
if(rk=='tl')return{h:['Balita','Desa','Jenis','Keterangan','Tanggal'],r:v.flatMap(b=>(F[b.id+'|'+M]?.log||[]).map(x=>[b.nama,b.pos,x.j,x.k,x.w]))};
if(rk=='dsb')return{h:['Bulan','S','D','Belum','D/S'],r:MS.map(m=>{const x=stat(v,m);return[ml(m),x.S,x.D,x.N,pct(x.P)]})};
return{h:['Desa','S','D','Belum','D/S'],r:posL().map(p=>{const x=stat(v.filter(b=>b.pos==p),M);return[p,x.S,x.D,x.N,pct(x.P)]})}}
P.rek=()=>{const d=RK();return `<h2>Rekap & Laporan — ${ml(M)}</h2><div class=bar2><select onchange="rk=this.value;go()">${Object.entries(RT).map(([k,t])=>`<option value=${k} ${k==rk?'selected':''}>${t}</option>`).join('')}</select><button onclick=xl()>Export Excel (CSV)</button><button class=s onclick=cp()>Salin ke Excel</button><button class=s onclick="window.print()">Cetak / PDF</button></div><h3>${RT[rk]}</h3>${tb(d.h,d.r.map(r=>`<tr>${r.map(c=>`<td>${E(c)}</td>`).join('')}</tr>`))}`};
const csv=(d,s)=>[d.h,...d.r].map(r=>r.map(c=>s==','?'"'+String(c).replace(/"/g,'""')+'"':c).join(s)).join('\n');
async function xl(){const dl=await claude.use('downloads');if(!dl){toast('Fitur unduh tidak tersedia di tampilan ini');return}await dl.save({filename:`rekap-${rk}-${M}.csv`,data:'\ufeff'+csv(RK(),',')});L('Export '+RT[rk])}
function cp(){try{navigator.clipboard.writeText(csv(RK(),'\t')).then(()=>toast('Disalin — tempel di Excel'),()=>toast('Gagal menyalin'))}catch(e){toast('Gagal menyalin')}}
P.usr=()=>{ensureNames(Object.keys(ROLES));return `<h2>Manajemen Pengguna</h2><p><small>Berikan peran ke anggota organisasi yang membuka halaman ini. Nama diambil otomatis dari direktori organisasi — tidak ada username/password.</small></p>
${tb(['Nama','Peran','Desa','Aksi'],Object.entries(ROLES).map(([id,r])=>`<tr><td>${E(nm(id))}</td><td>${RN[r.role]}</td><td>${r.pos}</td><td>${id==MEID?'<small>Anda</small>':`<button class=s style="color:var(--bad)" onclick="hapusRole('${id}')">Hapus peran</button>`}</td></tr>`))}
<details class=cd style="margin-top:10px"><summary><b>+ Tetapkan peran</b></summary><div class=fm><label>Cari anggota organisasi<input id=usq placeholder="Ketik nama…" oninput="cariUser(this.value)"></label><label>Peran<select id=urr><option value=gizi>Petugas Gizi</option><option value=kader>Kader Posyandu</option><option value=admin>Admin Puskesmas</option></select></label><label>Desa (kader)<select id=urp>${POS.map(p=>`<option>${p}</option>`).join('')}</select></label></div><div id=usres style="margin-top:8px"></div></details>
<h3>Hak akses</h3>${tb(['Fitur','Admin','Petugas Gizi','Kader'],[['Dashboard, sasaran, verifikasi, penimbangan, reminder, tindak lanjut, rekap','✓ semua','✓ semua','✓ Desa sendiri'],['Manajemen pengguna','✓','–','–'],['Riwayat perubahan data','✓','✓','–']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`))}`};
let SR=[];
async function cariUser(v){SR=await USERCAP.search(v);$('#usres').innerHTML=SR.map((p,i)=>`<div class=bar2><button class=s onclick="tetapkanRole(${i})">${E(p.name||'Tanpa nama')}</button></div>`).join('')||'<small>Tidak ada hasil.</small>'}
function tetapkanRole(i){const p=SR[i],role=$('#urr').value,pos=role=='kader'?$('#urp').value:'Semua';ROLES[p.id]={role,pos};NAMES[p.id]=p.name||NAMES[p.id]||'';L('Tetapkan peran '+(p.name||p.id)+' -> '+RN[role]);push('ROLES');go();toast('Peran ditetapkan')}
function hapusRole(id){delete ROLES[id];L('Hapus peran pengguna '+nm(id));push('ROLES');go();toast('Peran dihapus')}
P.log=()=>{ensureNames(AU.map(a=>a.u));return `<h2>Riwayat Perubahan Data</h2>${tb(['Waktu','Pengguna','Aktivitas'],AU.map(a=>`<tr><td>${a.w}</td><td>${E(nm(a.u))}</td><td>${E(a.t)}</td></tr>`))}<p><small>Data tersinkron otomatis antar pengguna secara real-time, seperti dokumen bersama — tidak perlu refresh atau login ulang.</small></p>`};
let syt='Menyambung…';
function setSt(t){syt=t;const e=$('#sy');if(e)e.textContent='● '+t}
function busy(){return /INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||'')}
const KEYS=['B','W','F','R','J','AU','ROLES'];
const GET={B:()=>B,W:()=>W,F:()=>F,R:()=>R,J:()=>J,AU:()=>AU.slice(0,300),ROLES:()=>ROLES};
const SET={B:v=>B=v,W:v=>W=v,F:v=>F=v,R:v=>R=v,J:v=>J=v,AU:v=>AU=v,ROLES:v=>ROLES=v};
let DB=null,last={},tmr={},pendIn={};
function push(k){if(!DB)return;clearTimeout(tmr[k]);tmr[k]=setTimeout(()=>save(k),600)}
async function save(k){try{const s=JSON.stringify(GET[k]());if(s===last[k])return;last[k]=s;await DB.doc('state/'+k).set({v:JSON.parse(s)});setSt('Tersinkron')}catch(e){setSt('Gagal menyimpan, mencoba lagi…');tmr[k]=setTimeout(()=>save(k),3000)}}
function flushIn(){if(busy())return;let ch=false;for(const k in pendIn){last[k]=pendIn[k];SET[k](JSON.parse(pendIn[k]));ch=true;delete pendIn[k]}if(ch)go()}
async function initDb(){try{DB=await claude.use('db');
if(!DB){setSt('Mode lokal (tidak tersinkron)');if(!ROLES[MEID])ROLES[MEID]={role:'admin',pos:'Semua'};dbReady=true;go();return}
const snaps=await Promise.all(KEYS.map(k=>DB.doc('state/'+k).get()));let miss=false;
KEYS.forEach((k,i)=>{if(snaps[i].exists){const s=JSON.stringify(snaps[i].data().v);last[k]=s;SET[k](JSON.parse(s))}else miss=true});
if(!ROLES[MEID]&&IS_OWNER){ROLES[MEID]={role:'admin',pos:'Semua'};miss=true}
if(miss)await Promise.all(KEYS.map(k=>save(k)));
setSt('Tersinkron');dbReady=true;go();
KEYS.forEach(k=>DB.doc('state/'+k).onSnapshot(x=>{if(x.exists&&!x.metadata.hasPendingWrites){const s=JSON.stringify(x.data().v);if(s!==last[k])pendIn[k]=s}},()=>setSt('Offline')));
setInterval(flushIn,1000)}catch(e){setSt('Mode lokal (tidak tersinkron)');if(!ROLES[MEID])ROLES[MEID]={role:'admin',pos:'Semua'};dbReady=true;go()}}
async function boot(){const u=window.claude&&claude.use?await claude.use('user'):null;
if(!u){go();return}
USERCAP=u;const me=await u.me();ME=me;MEID=me.id;IS_OWNER=me.isOwner;
go();await initDb()}
boot();
</script></body></html>
